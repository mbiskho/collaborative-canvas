# Two relay instances behind nginx, sharing Redis and Postgres. Open
# http://localhost:8088 in two browsers. Each may land on a different instance
# and they still see each other, which is the cross-instance path working.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    ports: ["5433:5432"]
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  server-1: &server
    build: ./server
    environment:
      DATABASE_URL: postgres://canvas:canvas@postgres:5432/canvas
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:8088,http://localhost:5173
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  server-2:
    <<: *server
    ports: ["8082:8080"]

  compactor:
    build: ./compactor
    environment:
      DATABASE_URL: postgres://canvas:canvas@postgres:5432/canvas
      INTERVAL_SECONDS: "60"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: ./web
    ports: ["8088:80"]
    depends_on: [server-1, server-2]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9091:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  pgdata:
